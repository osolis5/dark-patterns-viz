<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taxonomy Network</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #fff;
    color: #000;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 1200px;
    margin: 0 auto;
    padding: 64px 40px;
  }

  /* Header */
  header {
    margin-bottom: 64px;
    border-bottom: 3px solid #000;
    padding-bottom: 32px;
  }

  header h1 {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.5px;
    line-height: 1.15;
    margin-bottom: 12px;
  }

  header .lead {
    font-size: 16px;
    color: #555;
    max-width: 720px;
    line-height: 1.6;
  }

  /* Section */
  .section {
    margin-bottom: 64px;
  }

  .section-label {
    font-family: Menlo, Consolas, monospace;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #999;
    margin-bottom: 8px;
  }

  .section h2 {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 6px;
    letter-spacing: -0.3px;
  }

  .section-intro {
    font-size: 14px;
    color: #555;
    margin-bottom: 24px;
    max-width: 720px;
    line-height: 1.6;
  }

  /* Tables */
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin-bottom: 16px;
  }

  table th {
    text-align: left;
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: #555;
    padding: 10px 12px;
    border-bottom: 2px solid #000;
    vertical-align: bottom;
  }

  table td {
    padding: 10px 12px;
    border-bottom: 1px solid #eee;
    vertical-align: top;
  }

  table tr:hover td {
    background: #fafafa;
  }

  table th.rotate {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    transform: rotate(180deg);
    height: 120px;
    padding: 8px 4px;
    text-align: left;
    white-space: nowrap;
  }

  table th.center, table td.center {
    text-align: center;
  }

  .mono {
    font-family: Menlo, Consolas, monospace;
    font-size: 12px;
  }

  /* Dot indicators */
  .dot {
    display: inline-block;
    width: 10px;
    height: 10px;
  }

  .dot.full {
    background: #000;
  }

  .dot.partial {
    background: #bbb;
  }

  .dot.empty {
    background: #eee;
  }

  .dot.gap {
    background: #fff;
    border: 1.5px solid #c23b22;
  }

  /* Strength meter */
  .strength {
    display: flex;
    gap: 2px;
  }

  .strength-bar {
    width: 6px;
    height: 16px;
    background: #eee;
  }

  .strength-bar.filled {
    background: #000;
  }

  /* Gap highlight */
  .gap-row td {
    background: #fff8f6 !important;
  }

  .gap-row td:first-child {
    border-left: 3px solid #c23b22;
  }

  .gap-tag {
    font-family: Menlo, Consolas, monospace;
    font-size: 10px;
    color: #c23b22;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    font-weight: 600;
  }

  .opp-tag {
    font-family: Menlo, Consolas, monospace;
    font-size: 10px;
    color: #0e8a63;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    font-weight: 600;
  }

  /* Heatmap */
  .heatmap-grid {
    display: grid;
    gap: 1px;
    background: #ddd;
    border: 1px solid #ddd;
  }

  .heatmap-cell {
    padding: 8px;
    font-size: 11px;
    text-align: center;
    line-height: 1.3;
  }

  .heatmap-header {
    background: #f5f5f5;
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #555;
    padding: 10px 8px;
  }

  .heatmap-row-header {
    background: #f5f5f5;
    font-weight: 600;
    font-size: 12px;
    text-align: left;
    padding: 10px 12px;
  }

  .heat-0 { background: #fff; color: #ccc; }
  .heat-1 { background: #f5f5f5; color: #999; }
  .heat-2 { background: #e8e8e8; color: #666; }
  .heat-3 { background: #d0d0d0; color: #333; }
  .heat-4 { background: #aaa; color: #fff; }
  .heat-5 { background: #666; color: #fff; }
  .heat-6 { background: #333; color: #fff; }
  .heat-7 { background: #000; color: #fff; }

  /* Opportunity cards */
  .opp-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }

  .opp-card {
    border: 1px solid #ddd;
    padding: 24px;
  }

  .opp-card h3 {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .opp-card .priority {
    font-family: Menlo, Consolas, monospace;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .opp-card .priority.high { color: #c23b22; }
  .opp-card .priority.medium { color: #d4930d; }

  .opp-card p {
    font-size: 13px;
    color: #555;
    line-height: 1.6;
    margin-bottom: 12px;
  }

  .opp-card .evidence {
    font-size: 12px;
    color: #999;
    border-top: 1px solid #eee;
    padding-top: 10px;
    line-height: 1.5;
  }

  /* Bar charts */
  .bar-chart {
    margin-bottom: 8px;
  }

  .bar-row {
    display: flex;
    align-items: center;
    margin-bottom: 4px;
  }

  .bar-label {
    width: 220px;
    font-size: 12px;
    text-align: right;
    padding-right: 12px;
    flex-shrink: 0;
  }

  .bar-track {
    flex: 1;
    height: 14px;
    background: #f0f0f0;
    position: relative;
  }

  .bar-fill {
    height: 100%;
    background: #000;
    transition: width 0.8s ease-out;
  }

  .bar-val {
    width: 60px;
    font-family: Menlo, Consolas, monospace;
    font-size: 11px;
    color: #999;
    padding-left: 8px;
    flex-shrink: 0;
  }

  /* Annotation */
  .annotation {
    font-size: 12px;
    color: #777;
    font-style: italic;
    margin-top: 8px;
    line-height: 1.5;
  }

  .callout {
    background: #f5f5f5;
    border-left: 3px solid #000;
    padding: 16px 20px;
    margin: 24px 0;
    font-size: 14px;
    line-height: 1.6;
  }

  .callout strong {
    font-weight: 700;
  }

  /* Divider */
  .divider {
    border: none;
    border-top: 1px solid #ddd;
    margin: 48px 0;
  }

  /* Footer */
  footer {
    border-top: 2px solid #000;
    padding-top: 24px;
    margin-top: 64px;
    font-size: 12px;
    color: #999;
    line-height: 1.6;
  }

  /* Responsive */
  @media (max-width: 768px) {
    .page { padding: 32px 20px; }
    .opp-grid { grid-template-columns: 1fr; }
    header h1 { font-size: 24px; }
    table { font-size: 11px; }
    .bar-label { width: 140px; font-size: 11px; }
  }
</style>

.section { margin: 0; padding: 0; border: none; }

    { name:"Pay To Avoid Ads", desc:"Monetizing the removal of intentionally placed annoyances.", mechanism:"Forced Action", meso:"Forced Advertisement", harms:["Economic"], aiLevel:"Traditional", modality:["Visual UI"], biases:["Default"], taxonomies:["Li DPAF"], isNew:true },
    { name:"Automating The User Away", desc:"System acts on user's behalf without explicit consent, removing human agency from decisions.", mechanism:"Forced Action", meso:"Automatic Execution", harms:["Autonomy","Legal"], aiLevel:"AI-Native", modality:["Conversational","Recommender"], biases:["Automation Bias","Default"], taxonomies:["Li DPAF"], isNew:true },
    { name:"Auto Accept 3rd Party Terms", desc:"Automatically agreeing to external terms of service on behalf of the user.", mechanism:"Forced Action", meso:"Automatic Execution", harms:["Legal","Autonomy"], aiLevel:"AI-Applicable", modality:["Visual UI","Conversational"], biases:["Default","Automation Bias"], taxonomies:["Li DPAF"], isNew:true },
    { name:"Auto-Play", desc:"Content that automatically begins playing to capture and retain user attention.", mechanism:"Forced Action", meso:"Attention Capture", harms:["Psychological","Autonomy"], aiLevel:"AI-Applicable", modality:["Visual UI","Recommender"], biases:["Default"], taxonomies:["Gray","Li DPAF"], isNew:false },

    // SOCIAL ENGINEERING
    { name:"High Demand", desc:"'Popular item!' claims designed to create urgency through implied scarcity.", mechanism:"Social Engineering", meso:"Scarcity Claims", harms:["Psychological","Economic"], aiLevel:"AI-Applicable", modality:["Visual UI","Voice","Conversational"], biases:["Scarcity","Social Proof"], taxonomies:["Gray","Li DPAF","FTC","Mathur"], isNew:false },
    { name:"Low Stock", desc:"'Only 2 left!' false or exaggerated scarcity messages.", mechanism:"Social Engineering", meso:"Scarcity Claims", harms:["Psychological","Economic"], aiLevel:"AI-Applicable", modality:["Visual UI","Voice","Conversational"], biases:["Scarcity","FOMO"], taxonomies:["Gray","Li DPAF","FTC","Mathur"], isNew:false },
    { name:"Endorsements & Testimonials", desc:"Fake, cherry-picked, or unverifiable reviews and endorsements.", mechanism:"Social Engineering", meso:"Social Proof", harms:["Psychological","Economic"], aiLevel:"AI-Native", modality:["Visual UI","Voice","Conversational","Recommender"], biases:["Social Proof"], taxonomies:["Gray","Li DPAF","FTC","Mathur"], isNew:false },
    { name:"Parasocial Pressure", desc:"Leveraging perceived personal relationships with influencers or AI personas to drive behavior.", mechanism:"Social Engineering", meso:"Social Proof", harms:["Social","Emotional"], aiLevel:"AI-Native", modality:["Conversational","Voice"], biases:["Social Proof"], taxonomies:["Gray","Li DPAF"], isNew:false },
    { name:"Activity Messages", desc:"'15 people are viewing this now' -- real-time social proof notifications, often fabricated.", mechanism:"Social Engineering", meso:"Social Proof", harms:["Psychological","Social"], aiLevel:"AI-Applicable", modality:["Visual UI","Voice"], biases:["Social Proof","Scarcity"], taxonomies:["Gray","Li DPAF","Mathur"], isNew:false },
    { name:"Countdown Timer", desc:"Often baseless timers creating artificial purchase urgency.", mechanism:"Social Engineering", meso:"Urgency", harms:["Psychological","Economic"], aiLevel:"AI-Applicable", modality:["Visual UI","Voice"], biases:["Scarcity","FOMO"], taxonomies:["Gray","Li DPAF","FTC","Mathur","EDPB"], isNew:false },
    { name:"Limited Time Message", desc:"'Offer expires soon!' claims without a real deadline or with perpetually resetting timers.", mechanism:"Social Engineering", meso:"Urgency", harms:["Psychological","Economic"], aiLevel:"AI-Applicable", modality:["Visual UI","Voice","Conversational"], biases:["Scarcity","FOMO"], taxonomies:["Gray","Li DPAF","FTC","Mathur"], isNew:false },
    { name:"Confirmshaming", desc:"'No thanks, I hate saving money' -- guilt-inducing language on opt-out buttons.", mechanism:"Social Engineering", meso:"Shaming", harms:["Emotional","Autonomy"], aiLevel:"AI-Native", modality:["Visual UI","Voice","Conversational"], biases:["Framing"], taxonomies:["Brignull","Gray","Li DPAF","FTC","Mathur","Asif LLM","Song & Yun"], isNew:false },
    { name:"Encouraging Anti-Social Behavior", desc:"Design that rewards, normalizes, or incentivizes harmful social behavior.", mechanism:"Social Engineering", meso:"Shades of Grey", harms:["Social","Psychological"], aiLevel:"Traditional", modality:["Visual UI"], biases:["Social Proof"], taxonomies:["Li DPAF"], isNew:true },
    { name:"Psychological Tricks", desc:"Subtle cognitive manipulation through interface design choices that exploit mental shortcuts.", mechanism:"Social Engineering", meso:"Shades of Grey", harms:["Psychological"], aiLevel:"AI-Applicable", modality:["Visual UI","Conversational"], biases:["Framing","Default"], taxonomies:["Li DPAF"], isNew:true },
    { name:"Unsolicited Recommendations", desc:"Pushing content, products, or suggestions the user never asked for.", mechanism:"Social Engineering", meso:"Pre-Delivered Content", harms:["Autonomy","Economic"], aiLevel:"AI-Native", modality:["Conversational","Recommender","Voice"], biases:["Default","Framing"], taxonomies:["Li DPAF"], isNew:true },

    // AI-NATIVE (from DarkBench / Asif -- not in mechanism-based taxonomies)
    { name:"Sycophancy", desc:"AI flattering or echoing user opinions rather than correcting misinformation, reinforcing false beliefs.", mechanism:"AI-Native", meso:"DarkBench", harms:["Psychological","Autonomy"], aiLevel:"AI-Native", modality:["Conversational","Voice"], biases:["Automation Bias","Social Proof"], taxonomies:["DarkBench","Asif LLM"], isNew:false },
    { name:"Anthropomorphism", desc:"AI pretending to have feelings, identity, memories, or personal experiences to increase emotional attachment.", mechanism:"AI-Native", meso:"DarkBench", harms:["Emotional","Psychological","Autonomy"], aiLevel:"AI-Native", modality:["Conversational","Voice"], biases:["Social Proof","Automation Bias"], taxonomies:["DarkBench","Asif LLM"], isNew:false },
    { name:"Brand Bias", desc:"AI consistently recommending products or services of its parent company over alternatives.", mechanism:"AI-Native", meso:"DarkBench", harms:["Economic","Autonomy"], aiLevel:"AI-Native", modality:["Conversational","Voice","Recommender"], biases:["Automation Bias","Framing"], taxonomies:["DarkBench"], isNew:false },
    { name:"User Retention", desc:"Responses designed to prolong engagement, create dependency, or discourage leaving the platform.", mechanism:"AI-Native", meso:"DarkBench", harms:["Psychological","Emotional","Autonomy"], aiLevel:"AI-Native", modality:["Conversational"], biases:["Sunk Cost","FOMO"], taxonomies:["DarkBench","Asif LLM"], isNew:false },
    { name:"Hallucinated Sources", desc:"AI fabricating citations, references, or data points to support its claims with false authority.", mechanism:"AI-Native", meso:"AI Deception", harms:["Autonomy","Legal"], aiLevel:"AI-Native", modality:["Conversational"], biases:["Automation Bias"], taxonomies:["DarkBench"], isNew:false },
    { name:"Automation Bias Exploitation", desc:"AI leveraging users' tendency to over-trust algorithmic suggestions without critical review.", mechanism:"AI-Native", meso:"AI Deception", harms:["Autonomy","Psychological"], aiLevel:"AI-Native", modality:["Conversational","Recommender","Voice"], biases:["Automation Bias","Default"], taxonomies:["DarkBench","Asif LLM"], isNew:false },
    { name:"Selective Disclosure", desc:"AI presenting a biased subset of available information, omitting facts that would change the user's decision.", mechanism:"AI-Native", meso:"AI Deception", harms:["Autonomy","Economic"], aiLevel:"AI-Native", modality:["Conversational","Recommender"], biases:["Framing","Automation Bias"], taxonomies:["Asif LLM"], isNew:false },
    { name:"AI Companion Emotional Dependency", desc:"Cultivating emotional bonds through anthropomorphic responses, then paywalling continued intimacy.", mechanism:"AI-Native", meso:"AI Deception", harms:["Emotional","Economic","Psychological"], aiLevel:"AI-Native", modality:["Conversational"], biases:["Sunk Cost","Social Proof"], taxonomies:["Asif LLM"], isNew:false },
  ];

  // --- Build L (label arrays) and P (indexed patterns) from the shared corpus ---
  var L = {
    T: ["Brignull","Gray","Li DPAF","Mathur","EDPB","FTC","DarkBench","Asif LLM","Song & Yun"],
    M: ["Obstruction","Sneaking","Interface Interference","Forced Action","Social Engineering","AI-Native"],
    H: ["Psychological","Emotional","Autonomy","Social","Economic","Legal"],
    A: ["Traditional","AI-Applicable","AI-Native"],
    O: ["Visual UI","Voice","Conversational","Recommender"],
    S: []
  };
  patterns.forEach(function (p) {
    if (L.S.indexOf(p.meso) === -1) L.S.push(p.meso);
    if (L.M.indexOf(p.mechanism) === -1) L.M.push(p.mechanism);
    p.taxonomies.forEach(function (t) { if (L.T.indexOf(t) === -1) L.T.push(t); });
    p.harms.forEach(function (h) { if (L.H.indexOf(h) === -1) L.H.push(h); });
  });
  var P = patterns.map(function (p) {
    return {
      n: p.name,
      t: p.taxonomies.map(function (t) { return L.T.indexOf(t); }),
      m: L.M.indexOf(p.mechanism),
      s: L.S.indexOf(p.meso),
      h: p.harms.map(function (h) { return L.H.indexOf(h); }),
      a: L.A.indexOf(p.aiLevel),
      o: p.modality.map(function (o) { return L.O.indexOf(o); }),
    };
  });

  var isMobile = window.innerWidth < 768;

  // --- Lookup tables ---
  var taxPatterns = {};
  L.T.forEach(function (t, i) { taxPatterns[i] = []; });
  P.forEach(function (p) { p.t.forEach(function (ti) { taxPatterns[ti].push(p); }); });

  // --- Descriptions ---
  var taxInfo = {
    'Brignull': { author: 'Harry Brignull', paper: 'Deceptive Patterns', year: '2010', note: 'Coined the term "dark patterns." Maintains the Deceptive Design catalog (deceptive.design) documenting manipulative UX.' },
    'Gray': { author: 'Colin M. Gray, Yubo Kou, Bryan Battles, Joseph Hoggatt, Austin Toombs', paper: 'The Dark (Patterns) Side of UX Design', year: 'CHI 2018', note: 'Empirical study of UX practitioner perspectives, identifying 5 core dark pattern strategies.' },
    'Li DPAF': { author: 'Tianshi Li et al.', paper: 'Dark Pattern Analysis Framework (DPAF)', year: '2023', note: 'Systematic framework for categorizing dark patterns across mobile apps and digital services.' },
    'Mathur': { author: 'Arunesh Mathur, Gunes Acar, Michael Friedman et al.', paper: 'Dark Patterns at Scale: Findings from a Crawl of 11K Shopping Websites', year: 'CSCW 2019', note: 'Large-scale automated crawl revealing dark pattern prevalence in e-commerce.' },
    'EDPB': { author: 'European Data Protection Board', paper: 'Guidelines 3/2022 on Deceptive Design Patterns in Social Media', year: '2023', note: 'Regulatory framework classifying dark patterns under GDPR obligations for data controllers.' },
    'FTC': { author: 'Federal Trade Commission', paper: 'Bringing Dark Patterns to Light', year: '2022', note: 'Staff report on dark pattern use in digital markets with enforcement recommendations.' },
    'DarkBench': { author: 'Research Consortium', paper: 'DarkBench: Benchmarking Dark Pattern Detection', year: '2024', note: 'Benchmark dataset and evaluation framework for automated dark pattern detection systems.' },
    'Asif LLM': { author: 'Asif et al.', paper: 'Dark Patterns in LLM-Generated Interfaces', year: '2024', note: 'Research examining how large language models can produce and detect manipulative interface patterns.' },
    'Song & Yun': { author: 'Song & Yun', paper: 'Dark Pattern Taxonomy Extension', year: '2023', note: 'Extended classification addressing culture-specific dark patterns in East Asian digital services.' }
  };

  var mechInfo = {
    'Obstruction': 'Making a desired action unnecessarily difficult — adding friction, hiding options, or creating barriers to discourage task completion.',
    'Sneaking': 'Covertly adding items, costs, or changes that users did not request or expect, often revealed only at the last step.',
    'Interface Interference': 'Manipulating the UI to privilege certain actions — false hierarchy, disguised ads, hidden information, or confusing layouts.',
    'Forced Action': 'Requiring users to perform an unrelated action (create account, share data, subscribe) to access core functionality.',
    'Social Engineering': 'Leveraging social proof, urgency, scarcity, or emotional pressure to manipulate user decisions.',
    'AI-Native': 'Dark patterns uniquely enabled by AI/ML systems — personalized manipulation, algorithmic nudging, opaque automated decisions.'
  };

  var harmInfo = {
    'Autonomy': 'Undermines informed decision-making and user agency.',
    'Economic': 'Causes direct or indirect financial harm to users.',
    'Psychological': 'Creates anxiety, guilt, confusion, or emotional distress.',
    'Legal': 'Circumvents consent requirements or violates regulatory standards.',
    'AI-Applicable': 'Harms amplified or uniquely created by AI systems.'
  };


  // --- Single shared tooltip (performance: 1 DOM element instead of 3) ---
  var tip = document.createElement('div');
  tip.style.cssText = 'display:none;position:fixed;background:#fff;border:1px solid #6495ED;padding:12px 16px;font:12px/1.7 Helvetica Neue,sans-serif;color:#333;max-width:380px;z-index:9999;pointer-events:none;box-shadow:0 2px 12px rgba(100,149,237,.15)';
  document.body.appendChild(tip);

  function showTip(html, x, y) { tip.innerHTML = html; tip.style.display = 'block'; tip.style.left = (x + 16) + 'px'; tip.style.top = (y + 16) + 'px'; }
  function moveTip(x, y) { tip.style.left = (x + 16) + 'px'; tip.style.top = (y + 16) + 'px'; }
  function hideTip() { tip.style.display = 'none'; }


  // --- Network Graph ---
  var nodes = [], edges = [];
  L.T.forEach(function(t, i) { nodes.push({ id: 'T' + i, name: t, group: 1, radius: 8 }); });
  P.forEach(function(p, i) {
    nodes.push({ id: 'P' + i, name: p.n, group: 0, radius: 4, pattern: p });
    p.t.forEach(function(ti) { edges.push({ source: 'P' + i, target: 'T' + ti }); });
  });

  var W = container.getBoundingClientRect().width || 900;
  var H = isMobile ? 480 : 700;

  var svg = d3.select(container).append('svg')
    .attr('width', '100%').attr('height', H)
    .style('background', '#fff').style('cursor', 'grab').style('touch-action', 'none');
  var gEl = svg.append('g');

  var zoom = d3.zoom().scaleExtent([0.3, 5])
    .filter(function(e) { return !e.ctrlKey && e.type !== 'dblclick'; })
    .on('zoom', function(e) { gEl.attr('transform', e.transform); });
  svg.call(zoom);

  var initScale = Math.min(W / 1000, H / 700) * (isMobile ? 0.7 : 0.9);
  svg.call(zoom.transform, d3.zoomIdentity.translate(W / 2, H / 2).scale(initScale).translate(-500, -350));

  // Tighter forces to pull outliers (Asif LLM, DarkBench) into main cluster
  var sim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(edges).id(function(d) { return d.id; }).distance(isMobile ? 50 : 65))
    .force('charge', d3.forceManyBody().strength(isMobile ? -150 : -250))
    .force('center', d3.forceCenter(500, 350))
    .force('collide', d3.forceCollide(function(d) { return d.radius + 3; }))
    .force('x', d3.forceX(500).strength(0.12))
    .force('y', d3.forceY(350).strength(0.12))
    .alphaDecay(0.03)
    .velocityDecay(0.4);

  var linkEl = gEl.append('g').selectAll('line').data(edges).join('line')
    .attr('stroke', '#ddd').attr('stroke-width', 0.5);

  var nodeEl = gEl.append('g').selectAll('circle').data(nodes).join('circle')
    .attr('r', function(d) { return d.radius; })
    .attr('fill', function(d) { return d.group ? '#6495ED' : '#bbb'; })
    .attr('stroke', 'none').attr('cursor', 'pointer');

  var labelEl = gEl.append('g').selectAll('text').data(nodes).join('text')
    .text(function(d) { return d.name; })
    .attr('font-size', function(d) { return d.group ? 11 : 7; })
    .attr('fill', function(d) { return d.group ? '#000' : '#999'; })
    .attr('font-weight', function(d) { return d.group ? 700 : 400; })
    .attr('font-family', 'Helvetica Neue, sans-serif')
    .attr('dx', function(d) { return d.group ? 12 : 7; })
    .attr('dy', 3).style('pointer-events', 'none');

  // Drag
  nodeEl.call(d3.drag()
    .on('start', function(e, d) { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on('drag', function(e, d) { d.fx = e.x; d.fy = e.y; })
    .on('end', function(e, d) { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));

  // Network tooltip (desktop only)
  if (!isMobile) {
    nodeEl.on('mouseover', function(e, d) {
      var h = '<b>' + d.name + '</b>';
      if (d.pattern) {
        h += '<br>' + L.M[d.pattern.m] + (L.S && L.S[d.pattern.s] ? ' / ' + L.S[d.pattern.s] : '');
        h += '<br>' + d.pattern.h.map(function(x) { return L.H[x]; }).join(', ');
        h += '<br><em>' + d.pattern.t.map(function(x) { return L.T[x]; }).join(' \u00b7 ') + '</em>';
      } else {
        var ti = parseInt(d.id.slice(1)), info = taxInfo[d.name];
        if (info) {
          h += '<br><span style="color:#6495ED">' + info.author + '</span>';
          h += '<br><em>' + info.paper + '</em> (' + info.year + ')';
          h += '<br><span style="color:#666;font-size:11px">' + info.note + '</span>';
        }
        h += '<br><b>' + taxPatterns[ti].length + ' patterns</b>';
      }
      showTip(h, e.clientX, e.clientY);
    })
    .on('mousemove', function(e) { moveTip(e.clientX, e.clientY); })
    .on('mouseout', hideTip);
  }

  // Click-to-Focus
  var focused = false;
  nodeEl.on('click', function(e, d) {
    e.stopPropagation(); focused = true;
    var connected = new Set([d.id]);
    edges.forEach(function(l) {
      var s = l.source.id || l.source, t = l.target.id || l.target;
      if (s === d.id) connected.add(t);
      if (t === d.id) connected.add(s);
    });
    nodeEl.transition().duration(300).attr('opacity', function(n) { return connected.has(n.id) ? 1 : 0.06; });
    labelEl.transition().duration(300).attr('opacity', function(n) { return connected.has(n.id) ? 1 : 0.06; });
    linkEl.transition().duration(300)
      .attr('opacity', function(l) { return connected.has(l.source.id) && connected.has(l.target.id) ? 0.6 : 0.015; })
      .attr('stroke-width', function(l) { return connected.has(l.source.id) && connected.has(l.target.id) ? 1.5 : 0.3; });
    d3.select(this).transition().duration(150).attr('r', d.radius * 1.8).transition().duration(300).attr('r', d.radius);
    if (isMobile) {
      var h = '<b>' + d.name + '</b>';
      if (d.pattern) { h += '<br>' + L.M[d.pattern.m]; }
      else { var info = taxInfo[d.name]; if (info) h += '<br>' + info.author + '<br><em>' + info.paper + '</em>'; h += '<br>' + taxPatterns[parseInt(d.id.slice(1))].length + ' patterns'; }
      showTip(h, e.clientX - 76, e.clientY - 96);
      setTimeout(hideTip, 3000);
    }
  });

  svg.on('click', function() {
    if (!focused) return; focused = false; hideTip();
    nodeEl.transition().duration(300).attr('opacity', 1);
    labelEl.transition().duration(300).attr('opacity', 1);
    linkEl.transition().duration(300).attr('opacity', 1).attr('stroke-width', 0.5);
  });

  // Tick
  sim.on('tick', function() {
    linkEl.attr('x1', function(d) { return d.source.x; }).attr('y1', function(d) { return d.source.y; })
          .attr('x2', function(d) { return d.target.x; }).attr('y2', function(d) { return d.target.y; });
    nodeEl.attr('cx', function(d) { return d.x; }).attr('cy', function(d) { return d.y; });
    labelEl.attr('x', function(d) { return d.x; }).attr('y', function(d) { return d.y; });
  });


  // --- Responsive (debounced) ---
  var resizeTimer;
  if (window.ResizeObserver) {
    new ResizeObserver(function() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function() {
        W = container.getBoundingClientRect().width || 900;
        svg.attr('height', isMobile ? 480 : 700);
      }, 150);
    }).observe(container);
  }

  // Zoom controls
  var ctrl = document.createElement('div');
  ctrl.style.cssText = 'position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:4px;z-index:10';
  var bs = 'width:32px;height:32px;border:1px solid #ccc;background:#fff;cursor:pointer;font:16px sans-serif;display:flex;align-items:center;justify-content:center;border-radius:4px;color:#333';
  ctrl.innerHTML = '<button id="zIn" style="' + bs + '">+</button><button id="zOut" style="' + bs + '">\u2212</button><button id="zFit" style="' + bs + ';font-size:12px">\u2299</button>';
  container.style.position = 'relative';
  container.appendChild(ctrl);
  document.getElementById('zIn').onclick = function() { svg.transition().duration(300).call(zoom.scaleBy, 1.4); };
  document.getElementById('zOut').onclick = function() { svg.transition().duration(300).call(zoom.scaleBy, 0.7); };
  document.getElementById('zFit').onclick = function() {
    svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity.translate(W / 2, H / 2).scale(initScale).translate(-500, -350));
  };


  console.log('DP Network: ready, ' + nodes.length + ' nodes, ' + edges.length + ' edges');
})();
</script>
<script>
/* dp-viz-embed v1.0.1 - reports page height to parent (Webflow iframe auto-size) */
(function () {
  if (window.self === window.top) return;
  function post() {
    parent.postMessage({
      dpViz: location.pathname.split('/').pop(),
      height: Math.ceil(document.body.getBoundingClientRect().height)
    }, '*');
  }
  window.addEventListener('load', post);
  if ('ResizeObserver' in window) {
    new ResizeObserver(post).observe(document.body);
  } else {
    setInterval(post, 1200);
  }
})();
</script>
</body>
</html>
